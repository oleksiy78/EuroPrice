name: Update EuroPrice Fuel Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 4"

permissions:
  contents: write

jobs:
  update-fuel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas lxml requests

      - name: Update fuel prices
        run: python scripts/update_fuel.py

      - name: Commit changes
        run: |
          git config user.name "EuroPrice Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- prices.json; then
            echo "No fuel price changes."
          else
            git add prices.json
            git commit -m "Auto-update weekly fuel prices"
            git push
          fi
